version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs-checks:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    # The only Dockerfile lives here; "/" made every Dependabot docker run
    # fail with "No Dockerfiles found", so the Wolfi base digest pin never
    # received refresh PRs.
    directory: /images/debug
    schedule:
      interval: weekly
