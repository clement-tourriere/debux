name: Feature request
description: Suggest an improvement or new capability
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please focus on the debugging problem you want debux to solve.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to debug or improve?
      placeholder: I want to debug ... but currently ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should debux do?
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime area
      options:
        - Docker
        - Kubernetes
        - TUI
        - Installer / updater
        - Debug image / Nix tooling
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, commands, or tools you tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, terminal output, or examples.
