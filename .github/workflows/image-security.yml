name: Toolbox security

on:
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Immutable candidate commit"
        type: string
        required: true
    outputs:
      digest:
        description: "Validated whole-index OCI digest"
        value: ${{ jobs.build.outputs.digest }}
      archive-id:
        description: "Immutable candidate archive artifact ID"
        value: ${{ jobs.build.outputs.archive-id }}
      reports-id:
        description: "Immutable successful native validation artifact ID"
        value: ${{ jobs.collect.outputs.reports-id }}
  pull_request:
    paths:
      - "internal/entrypoint/**"
      - ".dockerignore"
      - "images/**"
      - "scripts/*image*"
      - ".github/workflows/image-security.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      archive-id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: mkdir -p dist
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/debug/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=dist/toolbox.tar
          tags: debux:validated
          provenance: true
          sbom: true
          # Refresh signed APK packages, not a stale package-install RUN.
          no-cache: true
          cache-from: type=gha,scope=toolbox-multiarch
          cache-to: type=gha,scope=toolbox-multiarch,mode=max
      - id: archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolbox-archive-${{ github.run_attempt }}
          path: dist/toolbox.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  scan:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.10"
          enable-cache: false
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.archive-id }}
          path: dist
          merge-multiple: true
      - name: Validate exact archive on the native architecture
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: scripts/validate-image-archive.sh dist/toolbox.tar "$DIGEST" "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: toolbox-validation-${{ matrix.arch }}
          path: dist/security/
          retention-days: 14
          # A failed-job retry replaces only its architecture's evidence. The
          # new artifact gets a new ID; the successful peer can be reused.
          overwrite: true
          if-no-files-found: error

  # A receipt is emitted only after scan + the complete offline smoke pass.
  # This job must not run with always(): both native workers are mandatory.
  collect:
    needs: [build, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reports-id: ${{ steps.reports.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.10"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: toolbox-validation-*
          path: dist/security
          merge-multiple: true
      - name: Require both matching validation records
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: uv run --script scripts/image_security.py receipts dist/security "$DIGEST"
      - id: reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolbox-validated-reports-${{ github.run_attempt }}
          path: dist/security/
          retention-days: 14
          if-no-files-found: error
