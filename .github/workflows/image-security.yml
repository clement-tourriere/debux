name: Toolbox security

on:
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Immutable candidate commit"
        type: string
        required: true
  pull_request:
    paths:
      - "internal/entrypoint/**"
      - ".dockerignore"
      - "images/**"
      - "scripts/*image*"
      - ".github/workflows/image-security.yml"

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: images/debug/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          # The weekly scan must refresh APK packages, not reuse a stale RUN.
          no-cache: true
          tags: debux:security
          cache-from: type=gha,scope=toolbox-${{ matrix.arch }}
          cache-to: type=gha,scope=toolbox-${{ matrix.arch }},mode=max
      - run: scripts/scan-image.sh docker:debux:security
      - run: scripts/test-image.sh debux:security
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: toolbox-security-${{ matrix.arch }}
          path: dist/security/
          retention-days: 14
