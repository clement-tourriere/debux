name: Toolbox security

on:
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Immutable candidate commit"
        type: string
        required: true
    outputs:
      digest:
        description: "Validated whole-index OCI digest"
        value: ${{ jobs.build.outputs.digest }}
      archive-id:
        description: "Immutable candidate archive artifact ID"
        value: ${{ jobs.build.outputs.archive-id }}
      reports-id:
        description: "Immutable successful native validation artifact ID"
        value: ${{ jobs.collect.outputs.reports-id }}
  pull_request:
    paths:
      - "internal/entrypoint/**"
      - ".dockerignore"
      - "images/**"
      - "scripts/*image*"
      - ".github/workflows/image-security.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      archive-id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - run: mkdir -p dist
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/debug/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=dist/toolbox.tar
          tags: debux:validated
          provenance: true
          sbom: true
          # Refresh signed APK packages, not a stale package-install RUN.
          no-cache: true
          cache-from: type=gha,scope=toolbox-multiarch
          cache-to: type=gha,scope=toolbox-multiarch,mode=max
      - id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolbox-archive-${{ github.run_attempt }}
          path: dist/toolbox.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  scan:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          enable-cache: false
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.archive-id }}
          path: dist
          merge-multiple: true
      - name: Validate exact archive on the native architecture
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: scripts/validate-image-archive.sh dist/toolbox.tar "$DIGEST" "$ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: toolbox-validation-${{ matrix.arch }}
          path: dist/security/
          retention-days: 14
          # A failed-job retry replaces only its architecture's evidence. The
          # new artifact gets a new ID; the successful peer can be reused.
          overwrite: true
          if-no-files-found: error

  # A receipt is emitted only after scan + the complete offline smoke pass.
  # This job must not run with always(): both native workers are mandatory.
  collect:
    needs: [build, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reports-id: ${{ steps.reports.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: toolbox-validation-*
          path: dist/security
          merge-multiple: true
      - name: Require both matching validation records
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: uv run --script scripts/image_security.py receipts dist/security "$DIGEST"
      - id: reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolbox-validated-reports-${{ github.run_attempt }}
          path: dist/security/
          retention-days: 14
          if-no-files-found: error
