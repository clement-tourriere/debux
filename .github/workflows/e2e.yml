name: E2E

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 4 * * 2"
  workflow_dispatch:
    inputs:
      debux_image:
        description: "Debug image to test"
        required: false
        default: ""
      run_kubernetes:
        description: "Run kind/Kubernetes e2e"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o bin/debux ./cmd/debux
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: inputs.debux_image == ''
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        if: inputs.debux_image == ''
        with:
          context: .
          file: images/debug/Dockerfile
          load: true
          tags: debux:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/e2e-docker.sh
        env:
          DEBUX_IMAGE: ${{ inputs.debux_image || 'debux:e2e' }}
          DEBUX_PULL_POLICY: ${{ inputs.debux_image && 'Always' || 'Never' }}

  # Exercise both the candidate CLI and candidate toolbox, including on PRs.
  # A manual image override provides a separate published-image compatibility run.
  kubernetes:
    if: github.event_name != 'workflow_dispatch' || inputs.run_kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: debux-e2e
      - run: CGO_ENABLED=0 go build -o bin/debux ./cmd/debux
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: inputs.debux_image == ''
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        if: inputs.debux_image == ''
        with:
          context: .
          file: images/debug/Dockerfile
          load: true
          tags: debux:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: kind load docker-image debux:e2e --name debux-e2e
        if: inputs.debux_image == ''
      - run: scripts/e2e-kubernetes.sh
        env:
          DEBUX_E2E_TOOL_TESTS: ${{ inputs.debux_image && '0' || '1' }}
          DEBUX_IMAGE: ${{ inputs.debux_image || 'debux:e2e' }}
          DEBUX_PULL_POLICY: ${{ inputs.debux_image && 'Always' || 'Never' }}
