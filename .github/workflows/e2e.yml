name: E2E

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 4 * * 2"
  workflow_dispatch:
    inputs:
      debux_image:
        description: "Debug image to test"
        required: false
        default: ""
      run_kubernetes:
        description: "Run kind/Kubernetes e2e"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o bin/debux ./cmd/debux
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: inputs.debux_image == ''
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: inputs.debux_image == ''
        with:
          context: .
          file: images/debug/Dockerfile
          load: true
          tags: debux:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/e2e-docker.sh
        env:
          DEBUX_IMAGE: ${{ inputs.debux_image || 'debux:e2e' }}
          DEBUX_PULL_POLICY: ${{ inputs.debux_image && 'Always' || 'Never' }}

  # Exercise both the candidate CLI and candidate toolbox, including on PRs.
  # A manual image override provides a separate published-image compatibility run.
  kubernetes:
    if: github.event_name != 'workflow_dispatch' || inputs.run_kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: debux-e2e
      - run: CGO_ENABLED=0 go build -o bin/debux ./cmd/debux
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: inputs.debux_image == ''
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: inputs.debux_image == ''
        with:
          context: .
          file: images/debug/Dockerfile
          load: true
          tags: debux:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: kind load docker-image debux:e2e --name debux-e2e
        if: inputs.debux_image == ''
      - run: scripts/e2e-kubernetes.sh
        env:
          DEBUX_E2E_TOOL_TESTS: ${{ inputs.debux_image && '0' || '1' }}
          DEBUX_IMAGE: ${{ inputs.debux_image || 'debux:e2e' }}
          DEBUX_PULL_POLICY: ${{ inputs.debux_image && 'Always' || 'Never' }}
