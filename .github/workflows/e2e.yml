name: E2E

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 4 * * 2"
  workflow_dispatch:
    inputs:
      debux_image:
        description: "Debug image to test"
        required: false
        default: "ghcr.io/clement-tourriere/debux:latest"
      run_kubernetes:
        description: "Run kind/Kubernetes e2e"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o bin/debux ./cmd/debux
      - run: scripts/e2e-docker.sh
        env:
          DEBUX_IMAGE: ${{ inputs.debux_image || 'ghcr.io/clement-tourriere/debux:latest' }}
          DEBUX_PULL_POLICY: Always

  # PR runs skip kind to keep PRs fast; the weekly schedule and manual
  # dispatch cover the flagship Kubernetes path so it is never entirely
  # without automated end-to-end coverage.
  kubernetes:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_kubernetes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: debux-e2e
      - run: CGO_ENABLED=0 go build -o bin/debux ./cmd/debux
      - run: scripts/e2e-kubernetes.sh
        env:
          DEBUX_IMAGE: ${{ inputs.debux_image || 'ghcr.io/clement-tourriere/debux:latest' }}
          DEBUX_PULL_POLICY: Always
