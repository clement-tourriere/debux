name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 1.2.3 or v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      # Cosign signing identities embed GITHUB_REF. A workflow_dispatch run
      # from a branch signs with @refs/heads/..., which every verifier
      # (install.sh, cosign policies) rejects. Fail fast before doing any work.
      - name: Require tag ref for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" != refs/tags/v* ]]; then
            echo "::error::workflow_dispatch must be run from a v* tag ref, got '$REF'."
            echo "::error::Runs from branches sign with a refs/heads/... identity that all verifiers reject. Re-run the workflow and select the release tag as the ref."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: scripts/release-meta.sh

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: go test -race ./...
      - run: scripts/govulncheck.sh ./...
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10" # Keep in sync with mise.toml.
      - run: uv run --script scripts/test_release.py
      - run: uv run --script scripts/test_image_security.py

  toolbox-security:
    needs: prepare
    uses: ./.github/workflows/image-security.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  binaries:
    needs: [prepare, verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Keep publishing on the same GoReleaser validated by mise and CI.
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/**"

  image:
    needs: [prepare, verify, toolbox-security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          enable-cache: false
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.toolbox-security.outputs.archive-id }}
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.toolbox-security.outputs.reports-id }}
          path: dist/security
          merge-multiple: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          base="${version%%-*}"
          major="${base%%.*}"
          minor="${base%.*}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/clement-tourriere/debux:${version}"
            if [[ "$version" != *-* ]]; then
              echo "ghcr.io/clement-tourriere/debux:${minor}"
              echo "ghcr.io/clement-tourriere/debux:${major}"
              echo "ghcr.io/clement-tourriere/debux:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish the exact natively validated archive
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
          DIGEST: ${{ needs.toolbox-security.outputs.digest }}
        run: scripts/publish-image-archive.sh dist/toolbox.tar "$DIGEST" dist/security

      - name: Sign image
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ needs.toolbox-security.outputs.digest }}
        run: cosign sign --yes "ghcr.io/clement-tourriere/debux@$DIGEST"

      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/clement-tourriere/debux
          subject-digest: ${{ needs.toolbox-security.outputs.digest }}
          push-to-registry: true
