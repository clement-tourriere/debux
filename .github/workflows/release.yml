name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 1.2.3 or v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      # Cosign signing identities embed GITHUB_REF. A workflow_dispatch run
      # from a branch signs with @refs/heads/..., which every verifier
      # (install.sh, cosign policies) rejects. Fail fast before doing any work.
      - name: Require tag ref for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" != refs/tags/v* ]]; then
            echo "::error::workflow_dispatch must be run from a v* tag ref, got '$REF'."
            echo "::error::Runs from branches sign with a refs/heads/... identity that all verifiers reject. Re-run the workflow and select the release tag as the ref."
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            raw="$INPUT_VERSION"
            version="${raw#v}"
            if [[ ! "$version" =~ $semver_re ]]; then
              echo "::error::Invalid version '$raw'. Expected X.Y.Z or vX.Y.Z"
              exit 1
            fi
            tag="v$version"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            if [[ ! "$version" =~ $semver_re ]]; then
              echo "::error::Invalid tag '$tag'. Expected vX.Y.Z"
              exit 1
            fi
          fi

          git fetch --force origin main --tags
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag does not exist. Run mise run release:bump and push the tag first."
            exit 1
          fi
          tag_sha="$(git rev-list -n 1 "$tag")"
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "::error::Tag $tag ($tag_sha) is not reachable from origin/main"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    needs: [prepare, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/**"

  image:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          base="${version%%-*}"
          major="${base%%.*}"
          minor="${base%.*}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/clement-tourriere/debux:${version}"
            if [[ "$version" != *-* ]]; then
              echo "ghcr.io/clement-tourriere/debux:${minor}"
              echo "ghcr.io/clement-tourriere/debux:${major}"
              echo "ghcr.io/clement-tourriere/debux:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: images/debug/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign image
        env:
          COSIGN_YES: "true"
        run: cosign sign --yes "ghcr.io/clement-tourriere/debux@${{ steps.build.outputs.digest }}"

      - name: Attest image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/clement-tourriere/debux
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
