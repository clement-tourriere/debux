name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 1.2.3 or v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      # Cosign signing identities embed GITHUB_REF. A workflow_dispatch run
      # from a branch signs with @refs/heads/..., which every verifier
      # (install.sh, cosign policies) rejects. Fail fast before doing any work.
      - name: Require tag ref for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" != refs/tags/v* ]]; then
            echo "::error::workflow_dispatch must be run from a v* tag ref, got '$REF'."
            echo "::error::Runs from branches sign with a refs/heads/... identity that all verifiers reject. Re-run the workflow and select the release tag as the ref."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: scripts/release-meta.sh

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: go test -race ./...
      - run: scripts/govulncheck.sh ./...
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10" # Keep in sync with mise.toml.
      - run: uv run --script scripts/test_release.py
      - run: uv run --script scripts/test_image_security.py

  toolbox-security:
    needs: prepare
    uses: ./.github/workflows/image-security.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  binaries:
    needs: [prepare, verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          # Keep publishing on the same GoReleaser validated by mise and CI.
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "dist/**"

  image:
    needs: [prepare, verify, toolbox-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
      - run: sudo apt-get update && sudo apt-get install -y skopeo && mkdir -p dist

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          base="${version%%-*}"
          major="${base%%.*}"
          minor="${base%.*}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/clement-tourriere/debux:${version}"
            if [[ "$version" != *-* ]]; then
              echo "ghcr.io/clement-tourriere/debux:${minor}"
              echo "ghcr.io/clement-tourriere/debux:${major}"
              echo "ghcr.io/clement-tourriere/debux:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: images/debug/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=dist/toolbox.tar
          tags: debux:validated
          provenance: true
          sbom: true
          cache-from: |
            type=gha,scope=toolbox-amd64
            type=gha,scope=toolbox-arm64

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Validate and publish the exact image archive
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
        run: scripts/publish-image-archive.sh dist/toolbox.tar "${{ steps.build.outputs.digest }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: toolbox-publish-security
          path: dist/security/
          retention-days: 14

      - name: Sign image
        env:
          COSIGN_YES: "true"
        run: cosign sign --yes "ghcr.io/clement-tourriere/debux@${{ steps.build.outputs.digest }}"

      - name: Attest image
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/clement-tourriere/debux
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
