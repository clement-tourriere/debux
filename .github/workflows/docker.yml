name: Docker

on:
  push:
    branches: [main]
    paths:
      - "internal/entrypoint/**"
      - ".dockerignore"
      - "images/**"
      - "scripts/*image*"
      - ".github/workflows/docker.yml"
      - ".github/workflows/image-security.yml"
  pull_request:
    branches: [main]
    paths:
      - "internal/entrypoint/**"
      - ".dockerignore"
      - "images/**"
      - "scripts/*image*"
      - ".github/workflows/docker.yml"
      - ".github/workflows/image-security.yml"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    uses: ./.github/workflows/image-security.yml
    with:
      ref: ${{ github.sha }}

  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.10"
          enable-cache: false
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.archive-id }}
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.reports-id }}
          path: dist/security
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact natively validated archive
        env:
          IMAGE_TAGS: ghcr.io/clement-tourriere/debux:latest
          DIGEST: ${{ needs.validate.outputs.digest }}
        run: scripts/publish-image-archive.sh dist/toolbox.tar "$DIGEST" dist/security
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ needs.validate.outputs.digest }}
        run: cosign sign --yes "ghcr.io/clement-tourriere/debux@$DIGEST"
