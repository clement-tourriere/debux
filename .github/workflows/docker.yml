name: Docker

on:
  push:
    branches: [main]
    paths:
      - "internal/entrypoint/**"
      - ".dockerignore"
      - "images/**"
      - "scripts/*image*"
      - ".github/workflows/docker.yml"
      - ".github/workflows/image-security.yml"
  pull_request:
    branches: [main]
    paths:
      - "internal/entrypoint/**"
      - ".dockerignore"
      - "images/**"
      - "scripts/*image*"
      - ".github/workflows/docker.yml"
      - ".github/workflows/image-security.yml"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    uses: ./.github/workflows/image-security.yml
    with:
      ref: ${{ github.sha }}

  build-and-push:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
      - run: sudo apt-get update && sudo apt-get install -y skopeo && mkdir -p dist

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/clement-tourriere/debux
          # Version tags are published by release.yml; this workflow only
          # tracks main as :latest, after both native architecture gates pass.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: images/debug/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=dist/toolbox.tar
          tags: debux:validated
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: |
            type=gha,scope=toolbox-amd64
            type=gha,scope=toolbox-arm64

      - name: Validate and publish the exact image archive
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: scripts/publish-image-archive.sh dist/toolbox.tar "${{ steps.build.outputs.digest }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: toolbox-publish-security
          path: dist/security/
          retention-days: 14

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign image
        env:
          COSIGN_YES: "true"
        run: cosign sign --yes "ghcr.io/clement-tourriere/debux@${{ steps.build.outputs.digest }}"
