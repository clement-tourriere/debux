[tools]
go = "latest"
golangci-lint = "latest"
goreleaser = "latest"
hk = "latest"
pkl = "latest"
"pipx:commitizen" = "latest"

[vars]
binary = "debux"
image = "ghcr.io/clement-tourriere/debux:latest"

[tasks.build]
description = "Build the binary with CGO disabled"
run = "CGO_ENABLED=0 go build -o bin/{{vars.binary}} ./cmd/debux"

[tasks.build-dev]
description = "Build the binary for development (with CGO)"
run = "go build -o bin/{{vars.binary}} ./cmd/debux"

[tasks.install]
description = "Build and install the binary to ~/.local/bin"
depends = ["build"]
run = "bash -lc 'set -euo pipefail; dst=\"$HOME/.local/bin/{{vars.binary}}\"; mkdir -p \"$(dirname \"$dst\")\"; rm -f \"$dst\"; install -m 0755 bin/{{vars.binary}} \"$dst\"; if command -v xattr >/dev/null 2>&1; then xattr -c \"$dst\" 2>/dev/null || true; fi; if command -v codesign >/dev/null 2>&1; then codesign --force --sign - \"$dst\" >/dev/null 2>&1 || true; fi; \"$dst\" --help >/dev/null; printf \"Installed %s\\nRun hash -r if your shell still finds an older debux.\\n\" \"$dst\"'"

[tasks.uninstall]
description = "Remove the locally installed debux binary from ~/.local/bin"
run = "bash -lc 'set -euo pipefail; dst=\"$HOME/.local/bin/{{vars.binary}}\"; if [ -e \"$dst\" ] || [ -L \"$dst\" ]; then rm -f \"$dst\"; printf \"Removed %s\\nRun hash -r if your shell still has debux cached.\\n\" \"$dst\"; else printf \"%s is not installed.\\n\" \"$dst\"; fi'"

[tasks.image-build]
description = "Build the Docker debug image"
run = "docker build -t {{vars.image}} -f images/debug/Dockerfile ."

[tasks.image-push]
description = "Push the Docker debug image"
run = "docker push {{vars.image}}"

[tasks.docs]
description = "Serve the documentation site locally"
run = "cd docs && python3 -m http.server ${PORT:-8000}"

[tasks."docs:open"]
description = "Open the documentation site in your browser"
run = "python3 -c \"import pathlib, webbrowser; webbrowser.open(pathlib.Path('docs/index.html').resolve().as_uri())\""

[tasks.dev]
description = "Build binary and Docker image for development"
depends = ["build", "image-build"]

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin/"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.lint]
description = "Run linter"
run = "golangci-lint run"

[tasks.hooks-install]
description = "Install hk git hooks for this repository"
run = "hk install --mise"

[tasks.pre-commit]
description = "Run hk pre-commit checks"
run = "hk run pre-commit"

[tasks.check]
description = "Run hk checks on all files"
run = "hk check --all --check"

[tasks."release:bump"]
description = "Bump version, changelog, and tag with Commitizen"
run = "cz bump"

[tasks."release:dry-run"]
description = "Build release artifacts locally without publishing"
run = "goreleaser release --snapshot --clean"

[tasks."release:push"]
description = "Push main and tags to trigger the GitHub release workflow"
run = "git push origin main --follow-tags"

[tasks.fix]
description = "Run hk fixes on all files"
run = "hk fix --all"
