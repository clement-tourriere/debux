[tools]
go = "1.26.3"
golangci-lint = "2.10.1"
goreleaser = "2.15.4"
hk = "1.44.2"
pkl = "0.31.1"
"pipx:commitizen" = "4.13.7"

[vars]
binary = "debux"
image = "ghcr.io/clement-tourriere/debux:latest"

[tasks.build]
description = "Build the binary with CGO disabled"
run = "CGO_ENABLED=0 go build -o bin/{{vars.binary}} ./cmd/debux"

[tasks.build-dev]
description = "Build the binary for development (with CGO)"
run = "go build -o bin/{{vars.binary}} ./cmd/debux"

[tasks.install]
description = "Build and install the binary to ~/.local/bin"
depends = ["build"]
run = "bash -lc 'set -euo pipefail; dst=\"$HOME/.local/bin/{{vars.binary}}\"; mkdir -p \"$(dirname \"$dst\")\"; rm -f \"$dst\"; install -m 0755 bin/{{vars.binary}} \"$dst\"; if command -v xattr >/dev/null 2>&1; then xattr -c \"$dst\" 2>/dev/null || true; fi; if command -v codesign >/dev/null 2>&1; then codesign --force --sign - \"$dst\" >/dev/null 2>&1 || true; fi; \"$dst\" --help >/dev/null; printf \"Installed %s\\nRun hash -r if your shell still finds an older debux.\\n\" \"$dst\"'"

[tasks.uninstall]
description = "Remove the locally installed debux binary from ~/.local/bin"
run = "bash -lc 'set -euo pipefail; dst=\"$HOME/.local/bin/{{vars.binary}}\"; if [ -e \"$dst\" ] || [ -L \"$dst\" ]; then rm -f \"$dst\"; printf \"Removed %s\\nRun hash -r if your shell still has debux cached.\\n\" \"$dst\"; else printf \"%s is not installed.\\n\" \"$dst\"; fi'"

[tasks.image-build]
description = "Build the Docker debug image"
run = "docker build -t {{vars.image}} -f images/debug/Dockerfile ."

[tasks.image-push]
description = "Push the Docker debug image"
run = "docker push {{vars.image}}"

[tasks.docs]
description = "Serve the documentation site locally"
run = "cd docs && python3 -m http.server ${PORT:-8000}"

[tasks."docs:open"]
description = "Open the documentation site in your browser"
run = "python3 -c \"import pathlib, webbrowser; webbrowser.open(pathlib.Path('docs/index.html').resolve().as_uri())\""

[tasks.dev]
description = "Build binary and Docker image for development"
depends = ["build", "image-build"]

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin/"

[tasks."e2e:docker"]
description = "Run Docker end-to-end smoke tests"
depends = ["build"]
run = "scripts/e2e-docker.sh"

[tasks."e2e:kubernetes"]
description = "Run Kubernetes end-to-end smoke tests against the current kube-context"
depends = ["build"]
run = "scripts/e2e-kubernetes.sh"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.tidy]
description = "Tidy Go module files"
run = "go mod tidy"

[tasks.vulncheck]
description = "Run govulncheck with the project allowlist"
run = "scripts/govulncheck.sh ./..."

[tasks.lint]
description = "Run linter"
run = "golangci-lint run"

[tasks.hooks-install]
description = "Install hk git hooks for this repository"
run = "hk install --mise"

[tasks.pre-commit]
description = "Run hk pre-commit checks"
run = "hk run pre-commit"

[tasks.verify]
description = "Run the same lightweight checks expected before release"
run = "bash -lc 'set -euo pipefail; go mod tidy; git diff --exit-code -- go.mod go.sum; go test ./...; golangci-lint run; scripts/govulncheck.sh ./...'"

[tasks.check]
description = "Run repository verification checks"
run = "mise run verify"

[tasks."release:bump"]
description = "Bump version, changelog, and tag with Commitizen"
run = '''
set -eu
current_version="$(awk -F'"' '/^version = / {print $2; exit}' .cz.toml)"
current_tag="v${current_version}"

if [ -n "$current_version" ] && [ "$current_version" != "0.0.0" ] && ! git rev-parse -q --verify "refs/tags/${current_tag}" >/dev/null; then
  echo "Version is ${current_version}, but ${current_tag} is missing. Creating the release tag without GPG signing."
  git -c tag.gpgSign=false tag -a "$current_tag" -m "$current_tag"
  exit 0
fi

latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
if [ -n "$latest_tag" ] && [ -z "$(git log --format=%H "${latest_tag}..HEAD")" ]; then
  echo "No release bump needed: no commits since $latest_tag."
  exit 0
fi

tmp="$(mktemp)"
trap 'rm -f "$tmp"' EXIT
if GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=tag.gpgSign GIT_CONFIG_VALUE_0=false cz bump --yes >"$tmp" 2>&1; then
  cat "$tmp"
  exit 0
fi
status=$?
cat "$tmp"
if grep -Eq '\[(NO_COMMITS_FOUND|NO_COMMITS_TO_BUMP)\]' "$tmp"; then
  echo "No release bump needed: no eligible conventional commits since ${latest_tag:-the latest tag}."
  exit 0
fi
exit "$status"
'''

[tasks."release:dry-run"]
description = "Build release artifacts locally without publishing"
run = "goreleaser release --snapshot --clean --skip=sign"

[tasks."release:push"]
description = "Push main and tags to trigger the GitHub release workflow"
run = "git push origin main --follow-tags"

[tasks.fix]
description = "Run hk fixes on all files"
run = "hk fix --all"
