version: 2

builds:
  - main: ./cmd/debux
    binary: debux
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/clement-tourriere/debux/internal/version.Version={{ .Version }} -X github.com/clement-tourriere/debux/internal/version.Commit={{ .Commit }} -X github.com/clement-tourriere/debux/internal/version.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
